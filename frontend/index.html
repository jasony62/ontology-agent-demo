<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本体图谱展示 · 智能体任务编排本体</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f3f5f7; color: #222; }
  header { background: #1f3a52; color: #fff; padding: 14px 22px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 18px; font-weight: 600; }
  header .sub { font-size: 12px; color: #bcd3e4; }
  #health { margin-left: auto; font-size: 12px; background: #2c4d66; padding: 4px 12px; border-radius: 12px; }
  #health.ok { background: #1e6b3d; }
  main { padding: 14px; }
  .panel { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 14px; }
  .panel h2 { font-size: 15px; color: #33455f; margin-bottom: 8px; }
  .controls { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; color: #555; }
  .controls label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin: 8px 0; font-size: 12px; color: #666; }
  .legend .item { display: inline-flex; align-items: center; gap: 5px; }
  .legend .line { width: 22px; height: 0; border-top: 2px solid #999; display: inline-block; }
  .legend .line.dashed { border-top-style: dashed; }
  #graph { width: 100%; overflow: auto; }
  #graph svg { min-width: 900px; display: block; }
  #detail { margin-top: 10px; font-size: 13px; color: #444; background: #f7f9fb; border: 1px solid #e3e8ee; border-radius: 8px; padding: 10px; min-height: 20px; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>本体图谱展示</h1>
  <span class="sub">智能体任务编排本体 · OWL 2 RL 推理 API</span>
  <span id="health">连接中…</span>
</header>

<main>
  <section class="panel">
    <h2>本体图谱</h2>
    <div class="controls">
      <label><input type="checkbox" id="showInferred" checked> 推理边 can_execute</label>
      <label><input type="checkbox" id="showDeps" checked> 依赖边 depends_on / composed_of</label>
    </div>
    <div class="legend">
      <span class="item"><span class="line" style="border-color:#4a90a4"></span> has_capability</span>
      <span class="item"><span class="line" style="border-color:#d98a2b"></span> requires_capability</span>
      <span class="item"><span class="line dashed" style="border-color:#2f8f6b"></span> can_execute（推理）</span>
      <span class="item"><span class="line" style="border-color:#9aa0a6"></span> depends_on</span>
      <span class="item"><span class="line" style="border-color:#b58840"></span> composed_of</span>
      <span class="item"><span class="line" style="border-color:#c0652a"></span> assigned_to</span>
    </div>
    <div id="graph"></div>
    <div id="detail">点击节点查看详情（智能体 / 任务 / 能力）。</div>
  </section>
</main>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var graphBox = $("graph"), detailBox = $("detail");

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function fetchJSON(url, options) {
    return fetch(url, options).then(function (r) {
      if (!r.ok) { return r.json().then(function (j) { throw new Error(j.detail || r.statusText); }); }
      return r.json();
    });
  }

  /* ---------------- 图谱 ---------------- */
  var graphData = null;
  var nodePos = {};

  var COL_X = { Agent: 140, Task: 500, Capability: 860 };
  var COL_COLOR = { Agent: "#2f8f6b", Task: "#d98a2b", Capability: "#4a7fb5" };
  var EDGE_COLOR = {
    has_capability: "#4a90a4", requires_capability: "#d98a2b", can_execute: "#2f8f6b",
    depends_on: "#9aa0a6", composed_of: "#b58840", assigned_to: "#c0652a"
  };

  function layout(data) {
    var cols = { Agent: [], Task: [], Capability: [] };
    (data.individuals || []).forEach(function (ind) {
      if (cols[ind.group]) cols[ind.group].push(ind);
    });
    (data.classes || []).forEach(function (c) {
      if (c.parent === "Capability") cols.Capability.push({ name: c.name, label: c.label, group: "Capability" });
    });
    var step = 62, top = 46, h = 34;
    var pos = {}, maxY = 0;
    Object.keys(cols).forEach(function (g) {
      cols[g].forEach(function (n, i) {
        pos[n.name] = { x: COL_X[g], y: top + i * step, group: g, label: n.label };
        maxY = Math.max(maxY, pos[n.name].y);
      });
    });
    return { pos: pos, height: maxY + 70 };
  }

  function renderGraph() {
    if (!graphData) return;
    var showInferred = $("showInferred").checked;
    var showDeps = $("showDeps").checked;
    var lay = layout(graphData);
    nodePos = lay.pos;

    var edges = (graphData.edges || []).filter(function (e) {
      if (e.property === "can_execute") return showInferred;
      if (e.property === "depends_on" || e.property === "composed_of") return showDeps;
      return true;
    });

    var svg = '<svg width="1000" height="' + lay.height + '" viewBox="0 0 1000 ' + lay.height + '">';
    svg += '<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#8a94a0"/></marker></defs>';

    // 列标题
    [["Agent", "智能体", "#2f8f6b"], ["Task", "任务", "#d98a2b"], ["Capability", "能力", "#4a7fb5"]].forEach(function (c) {
      svg += '<text x="' + (COL_X[c[0]] - 60) + '" y="26" font-size="15" font-weight="bold" fill="' + c[2] + '">' + c[1] + "</text>";
    });

    // 边
    edges.forEach(function (e) {
      var s = nodePos[e.source], t = nodePos[e.target];
      if (!s || !t) return;
      var color = EDGE_COLOR[e.property] || "#999";
      var dash = e.property === "can_execute" ? ' stroke-dasharray="6,4"' : "";
      var sw = e.property === "assigned_to" ? 2.5 : 1.4;
      var d;
      if (s.group === t.group) {
        // 同列：任务→任务 用上方弧线
        var mid = Math.min(s.y, t.y) - 24;
        d = 'M' + (s.x + 45) + ',' + s.y + ' C' + (s.x + 60) + ',' + mid + ' ' + (t.x + 60) + ',' + mid + ' ' + (t.x + 45) + ',' + t.y;
      } else {
        var x1 = s.x + 50, y1 = s.y + 17, x2 = t.x - 50, y2 = t.y + 17;
        var bend = s.group === "Agent" && t.group === "Capability" ? 60 : 20;
        d = 'M' + x1 + ',' + y1 + ' C' + (x1 + (x2 - x1) / 2 + bend) + ',' + y1 + ' ' + (x2 - (x2 - x1) / 2 - bend) + ',' + y2 + ' ' + x2 + ',' + y2;
      }
      svg += '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="' + sw + '"' + dash + ' marker-end="url(#arrow)" opacity="0.75"/>';
    });

    // 节点
    Object.keys(nodePos).forEach(function (name) {
      var p = nodePos[name];
      var color = COL_COLOR[p.group];
      var sub = "";
      if (p.group === "Task") {
        var ind = (graphData.individuals || []).filter(function (i) { return i.name === name; })[0];
        if (ind && ind.risk_level >= 4) sub = '<text x="' + (p.x - 44) + '" y="' + (p.y + 12) + '" font-size="10.5" fill="#c0652a">风险' + ind.risk_level + '</text>';
      }
      svg += '<g class="node" data-name="' + esc(name) + '" style="cursor:pointer">';
      svg += '<rect x="' + (p.x - 46) + '" y="' + p.y + '" width="92" height="34" rx="8" fill="#fff" stroke="' + color + '" stroke-width="1.6"/>';
      svg += '<text x="' + p.x + '" y="' + (p.y + 21) + '" text-anchor="middle" font-size="12.5" fill="#333">' + esc(p.label) + "</text>";
      svg += sub;
      svg += "</g>";
    });
    svg += "</svg>";

    graphBox.innerHTML = svg;
    graphBox.querySelectorAll(".node").forEach(function (g) {
      g.addEventListener("click", function () { showDetail(g.getAttribute("data-name")); });
    });
  }

  function showDetail(name) {
    var p = nodePos[name];
    if (!p) return;
    var text = "【" + p.label + "】";
    if (p.group === "Agent") {
      var a = (graphData.individuals || []).filter(function (i) { return i.name === name; })[0];
      text += "\n" + (a.description || "");
      text += "\n认证：" + (a.certified ? "已认证" : "未认证");
      text += "\n能力：" + (a.capabilities || []).map(function (c) {
        var cls = (graphData.classes || []).filter(function (x) { return x.name === c; })[0];
        return cls ? cls.label : c;
      }).join("、") || "（无）";
      var exec = (graphData.edges || []).filter(function (e) { return e.property === "can_execute" && e.source === name; });
      text += "\n可执行任务：" + (exec.length ? exec.map(function (e) { return (nodePos[e.target] || {}).label || e.target; }).join("、") : "（无）");
    } else if (p.group === "Task") {
      var t = (graphData.individuals || []).filter(function (i) { return i.name === name; })[0];
      text += "\n" + (t.description || "");
      text += "\n类型：" + (t.type || "") + "，风险等级：" + (t.risk_level || "-");
      text += "\n需要能力：" + (t.requires || []).map(function (c) {
        var cls = (graphData.classes || []).filter(function (x) { return x.name === c; })[0];
        return cls ? cls.label : c;
      }).join("、") || "（无）";
      if (t.constraints && t.constraints.length) text += "\n约束：" + t.constraints.join("、");
      var who = (graphData.edges || []).filter(function (e) { return e.property === "can_execute" && e.target === name; });
      text += "\n可执行者：" + (who.length ? who.map(function (e) { return (nodePos[e.source] || {}).label || e.source; }).join("、") : "（无）");
    } else {
      text += "\n能力类：作为 Agent 与任务匹配的纽带。";
    }
    detailBox.textContent = text;
  }

  function loadGraph() {
    return fetchJSON("/api/domains/current/ontology").then(function (d) {
      graphData = d;
      renderGraph();
    }).catch(function (e) { detailBox.textContent = "图谱加载失败：" + e.message; });
  }

  /* ---------------- 初始化 ---------------- */
  function init() {
    $("showInferred").addEventListener("change", renderGraph);
    $("showDeps").addEventListener("change", renderGraph);

    fetchJSON("/api/health").then(function (h) {
      var el = $("health");
      el.textContent = "引擎就绪：Agent×" + h.agents + " · Task×" + h.tasks + " · " + h.reasoner.split(" ")[0];
      el.className = "ok";
    }).catch(function () { $("health").textContent = "引擎离线"; });

    loadGraph().catch(function () {});
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
