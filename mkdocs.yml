site_name: 本体上手指南
site_description: 本体 × 智能体协作 —— 面向零基础读者的 9 篇入门系列（配套开源示例仓库）
site_author: yangyue

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

# docs_dir 指向指南目录本身：README.md 直接成为站点根 index.html
docs_dir: docs/guide

nav:
  - 指南首页: README.md
  - 概念认知:
      - 00 为什么需要本体: 00-为什么需要本体.md
      - 01 本体入门: 01-本体入门.md
      - 02 解剖示例本体: 02-解剖示例本体.md
  - 推理与图谱:
      - 03 本体推理原理: 03-本体推理原理.md
      - 04 本体与知识图谱: 04-本体与知识图谱.md
  - 服务搭建:
      - 05 搭建本体推理服务: 05-搭建本体推理服务.md
      - 06 MCP 接入智能体: 06-MCP接入智能体.md
  - 应用与扩展:
      - 07 智能体协作实战: 07-智能体协作实战.md
      - 08 扩展新领域: 08-扩展新领域.md
  - 用户手册:
      - 手册首页: ../manual/README.md
      - 01 快速开始: ../manual/01-快速开始.md
      - 02 推理与查询: ../manual/02-推理与查询.md
      - 03 前端与 MCP: ../manual/03-前端与MCP.md
      - 04 运维与本体管理: ../manual/04-运维与本体管理.md
      - 05 场景演练: ../manual/05-场景演练.md
      - 06 二次开发指南: ../manual/06-二次开发指南.md
      - 07 常见问题: ../manual/07-常见问题.md
      - 08 搭建本体推理服务: ../manual/08-搭建本体推理服务.md
      - 附录 速查表: ../manual/附录-速查表.md
