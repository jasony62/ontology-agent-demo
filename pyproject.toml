# 项目元数据 + 可安装包（可选用法：pip install -e .）
# 依赖清单与 requirements.txt 保持一致；常规快速开始仍用 pip install -r requirements.txt
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-agent-demo"
# 与 git tag 对齐。此前长期停在 0.2.3（v0.3.0 / v0.4.0 / v0.5.0 打了 tag 却没回来改
# 这个字段），发布 v0.6.0 时一并修正——版本号只在一个地方写错，就等于没有版本号。
version = "0.6.0"
description = "本体 × 智能体协作 Demo：通用推理引擎 + 领域适配器 + FastAPI + MCP，配套《本体上手指南》"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yangyue" }]
keywords = ["ontology", "owl", "reasoning", "mcp", "agent"]
dependencies = [
    "owlready2>=0.51",
    "owlrl>=6.0",
    "rdflib>=7.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "requests>=2.31",
    "httpx>=0.27",
    "mcp>=2.0",
    "pytest>=8.0",
]

[project.urls]
Documentation = "https://github.com/jasony62/ontology-agent-demo"

[tool.setuptools.packages.find]
include = ["api*", "reasoner*", "domains*", "mcp*", "scripts*", "config*", "examples*"]

# 运行时资源（不是代码，find 不会带）：领域本体与配置、配置模板。
# CQ 工位的中立默认 prompts 随子包搬进了 SDK（packages/ontology-plugin-sdk），
# 由那里的 package-data 负责分发，不在这里登记。
[tool.setuptools.package-data]
"config" = ["*.json"]
"examples" = ["*/*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 领域插件 SDK 在 workspace 包里（packages/ontology-plugin-sdk/src）。这里显式
# 加搜索路径，使得**即使没做 pip install**也能跑测试——CI 的干净检出场景走
# `pip install -r requirements.txt`（内含 -e），但开发机上常有只更新了代码、
# 忘了重装的情况；少一个"莫名其妙 ImportError"就是赚到。
pythonpath = [".", "packages/ontology-plugin-sdk/src"]
